<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두구두구 중대발표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold-1: #fff6c8;
    --gold-2: #ffd34d;
    --gold-3: #e09b12;
    --gold-4: #8a5600;
    --ink: #050307;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: #fff;
    font-family: "Nanum Myeongjo", "Apple SD Gothic Neo", "Malgun Gothic", serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button, input, textarea { font: inherit; }

  #stage { position: fixed; inset: 0; overflow: hidden; will-change: transform; }
  #bg {
    position: absolute; inset: -10%;
    background: radial-gradient(ellipse at center, #2a1a08 0%, #0d0805 45%, #000 80%);
    opacity: 0; transition: opacity 3s ease;
  }
  #bg.on { opacity: 1; }
  canvas#fx, canvas#cf { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* 레터박스 */
  .bar {
    position: fixed; left: 0; right: 0; height: 12vh; background: #000; z-index: 30;
    transform: scaleY(0); transition: transform 1.6s cubic-bezier(.7,0,.2,1);
  }
  .bar.top { top: 0; transform-origin: top; }
  .bar.bottom { bottom: 0; transform-origin: bottom; }
  .cinema .bar { transform: scaleY(1); }

  /* 비네팅 */
  #vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.85) 100%);
  }
  #flash {
    position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 40; pointer-events: none;
  }
  #flash.go { animation: flash 1.4s ease-out forwards; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* 자막 */
  #subtitle {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 0 24px; z-index: 10; text-align: center; pointer-events: none;
  }
  #subtitle .line {
    font-weight: 800;
    font-size: clamp(22px, 5.2vmin, 64px);
    letter-spacing: .18em;
    line-height: 1.5;
    word-break: keep-all;
    color: #f4e6c3;
    text-shadow: 0 0 24px rgba(255, 190, 90, .45), 0 0 2px #000;
    opacity: 0;
    animation: subIn 2.3s ease forwards;
  }
  #subtitle .line small {
    display: block; margin-top: .9em;
    font-size: .38em; letter-spacing: .6em; color: #b9a170; opacity: .8;
  }
  @keyframes subIn {
    0%   { opacity: 0; filter: blur(14px); transform: scale(1.15); letter-spacing: .5em; }
    25%  { opacity: 1; filter: blur(0); }
    80%  { opacity: 1; filter: blur(0); }
    100% { opacity: 0; filter: blur(8px); transform: scale(.96); letter-spacing: .14em; }
  }

  /* 두구두구 */
  #drum {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    z-index: 12; pointer-events: none; text-align: center;
  }
  #drum.on { display: flex; }
  #drum .dugu {
    font-family: "Black Han Sans", sans-serif;
    font-size: calc(var(--dsize, 10) * 1vmin);
    color: #fff;
    text-shadow: 0 0 30px rgba(255, 80, 40, .8), 0 6px 0 #6b0e00;
    transform: scale(var(--pulse, 1));
    white-space: nowrap;
  }
  #drum .tense {
    margin-top: 2vmin; font-size: clamp(14px, 2.6vmin, 26px); color: #c9b08a; letter-spacing: .3em;
  }

  /* 빛줄기 */
  #rays {
    position: absolute; left: 50%; top: 50%; width: 260vmax; height: 260vmax;
    margin: -130vmax 0 0 -130vmax; z-index: 2; pointer-events: none; opacity: 0;
    background: repeating-conic-gradient(from 0deg, rgba(255, 210, 110, .22) 0deg 6deg, transparent 6deg 18deg);
    -webkit-mask: radial-gradient(circle, #000 0%, transparent 55%);
            mask: radial-gradient(circle, #000 0%, transparent 55%);
    animation: spin 40s linear infinite;
    transition: opacity 1.2s ease;
  }
  #rays.on { opacity: 1; }
  #rays.hot { opacity: 1; animation-duration: 14s;
    background: repeating-conic-gradient(from 0deg, rgba(255, 230, 150, .4) 0deg 7deg, transparent 7deg 15deg); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 공개 */
  #reveal {
    position: absolute; inset: 0; z-index: 20; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 16vh 16px;
  }
  #reveal.on { display: flex; }
  #reveal .kicker {
    font-family: "Black Han Sans", sans-serif;
    font-size: clamp(14px, 3vmin, 30px); letter-spacing: .5em; color: #ffe9a8;
    margin-bottom: 3vmin; opacity: 0; animation: fadeUp .8s .5s ease forwards;
  }
  #reveal .msg {
    font-family: "Black Han Sans", sans-serif;
    line-height: 1.15;
    word-break: keep-all; overflow-wrap: anywhere;
    max-width: 92vw;
    background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 38%, var(--gold-3) 62%, var(--gold-4) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(255, 190, 60, .55)) drop-shadow(0 4px 0 rgba(70, 30, 0, .9));
    animation: slam 1.1s cubic-bezier(.2, 1.6, .4, 1) both, breathe 3.2s 1.2s ease-in-out infinite;
    user-select: text;
  }
  @keyframes slam {
    0%   { transform: scale(4) rotate(-6deg); opacity: 0; filter: blur(20px); }
    45%  { opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.035); }
  }
  #reveal .from {
    margin-top: 4vmin; font-size: clamp(14px, 2.8vmin, 28px); letter-spacing: .25em; color: #e9d7ae;
    opacity: 0; animation: fadeUp 1s 1.6s ease forwards;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  #actions {
    position: fixed; left: 0; right: 0; bottom: calc(14vh + env(safe-area-inset-bottom)); z-index: 35;
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 0 16px;
    opacity: 0; pointer-events: none; transition: opacity .8s ease;
  }
  #actions.on { opacity: 1; pointer-events: auto; }

  .btn {
    appearance: none; border: 1px solid rgba(255, 215, 120, .55); color: #ffe9b0;
    background: rgba(20, 12, 4, .6); backdrop-filter: blur(6px);
    padding: 12px 20px; border-radius: 999px; cursor: pointer; font-weight: 700; letter-spacing: .08em;
    transition: transform .15s ease, background .2s ease;
  }
  .btn:hover { background: rgba(70, 44, 10, .75); transform: translateY(-1px); }
  .btn:active { transform: scale(.97); }
  .btn.primary {
    background: linear-gradient(180deg, #ffd85a, #d38a0c); color: #2b1600; border-color: #ffe59a;
    box-shadow: 0 0 30px rgba(255, 190, 60, .45);
  }

  #skip {
    position: fixed; right: 16px; bottom: calc(12vh + 12px); z-index: 36;
    font-size: 13px; padding: 8px 14px; opacity: .55; display: none;
  }
  #skip.on { display: inline-block; }

  /* 시작 화면 */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: radial-gradient(ellipse at center, #1a0f05 0%, #000 75%);
    transition: opacity .8s ease;
  }
  .overlay.hide { opacity: 0; pointer-events: none; }
  .overlay[hidden] { display: none; }
  .card { width: 100%; max-width: 460px; text-align: center; }
  .seal {
    display: inline-block; font-family: "Black Han Sans", sans-serif; color: #ff5a4a;
    border: 3px solid #ff5a4a; padding: 6px 16px; transform: rotate(-6deg); letter-spacing: .3em;
    font-size: 18px; margin-bottom: 26px; opacity: .9;
  }
  .card h1 {
    font-weight: 800; font-size: clamp(22px, 6vw, 34px); letter-spacing: .1em; line-height: 1.45;
    color: #f4e6c3; margin-bottom: 14px; word-break: keep-all;
  }
  .card p { color: #a99673; font-size: 15px; line-height: 1.7; margin-bottom: 28px; word-break: keep-all; }
  .card .btn.primary { font-size: 18px; padding: 16px 34px; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 18px rgba(255, 190, 60, .35); } 50% { box-shadow: 0 0 46px rgba(255, 190, 60, .8); } }

  /* 만들기 화면 */
  .maker .field { text-align: left; margin-bottom: 14px; }
  .maker label { display: block; font-size: 13px; color: #bda97f; margin-bottom: 6px; letter-spacing: .1em; }
  .maker textarea, .maker input {
    width: 100%; border-radius: 12px; border: 1px solid rgba(255, 215, 120, .35);
    background: rgba(255, 240, 200, .06); color: #fff4d6; padding: 12px 14px; outline: none;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 16px; user-select: text;
  }
  .maker textarea { min-height: 90px; resize: vertical; }
  .maker textarea:focus, .maker input:focus { border-color: #ffd34d; box-shadow: 0 0 0 3px rgba(255, 211, 77, .2); }
  .maker .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .maker .out {
    margin-top: 18px; padding: 12px; border-radius: 12px; background: rgba(0, 0, 0, .4);
    border: 1px dashed rgba(255, 215, 120, .35); font-family: ui-monospace, monospace; font-size: 12px;
    color: #e8d3a0; word-break: break-all; text-align: left; display: none; user-select: text;
  }
  .maker .out.on { display: block; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); z-index: 60;
    background: #ffd34d; color: #2b1600; padding: 10px 18px; border-radius: 999px; font-weight: 700;
    opacity: 0; transition: all .3s ease; pointer-events: none; font-family: sans-serif; font-size: 14px;
  }
  .toast.on { opacity: 1; transform: translateX(-50%); }

  @media (prefers-reduced-motion: reduce) {
    #rays { animation: none; }
  }
</style>
</head>
<body>

<div id="stage">
  <div id="bg"></div>
  <div id="rays"></div>
  <canvas id="fx"></canvas>
  <canvas id="cf"></canvas>
  <div id="vignette"></div>
  <div id="subtitle"></div>
  <div id="drum"><div class="dugu">두구두구두구</div><div class="tense">(긴 장)</div></div>
  <div id="reveal">
    <div class="kicker">★ 공 개 ★</div>
    <div class="msg"></div>
    <div class="from"></div>
  </div>
  <div id="flash"></div>
</div>
<div class="bar top"></div>
<div class="bar bottom"></div>

<div id="actions">
  <button class="btn" id="replayBtn">↻ 다시 보기</button>
  <button class="btn" id="shareBtn">🔗 링크 복사</button>
  <button class="btn primary" id="makeBtn">✍ 나도 만들기</button>
</div>
<button class="btn" id="skip">건너뛰기 ⏭</button>

<!-- 시작 화면 (텍스트가 있을 때) -->
<div class="overlay" id="intro" hidden>
  <div class="card">
    <div class="seal">TOP SECRET</div>
    <h1>당신에게 전달된<br>중대 발표가 있습니다</h1>
    <p>🔊 반드시 소리를 켜고<br>마음의 준비를 한 뒤 눌러주십시오.</p>
    <button class="btn primary pulse" id="startBtn">공개를 시작한다</button>
  </div>
</div>

<!-- 만들기 화면 (텍스트가 없을 때) -->
<div class="overlay" id="maker" hidden>
  <div class="card maker">
    <div class="seal">중대발표 생성기</div>
    <h1>쓸데없이 웅장하게<br>공개해 드립니다</h1>
    <p>공개할 내용을 적으면 링크가 만들어집니다.</p>
    <div class="field">
      <label for="msgInput">공개할 내용</label>
      <textarea id="msgInput" maxlength="120" placeholder="예) 오늘 점심은 김치찌개"></textarea>
    </div>
    <div class="field">
      <label for="fromInput">보낸 사람 (선택)</label>
      <input id="fromInput" maxlength="30" placeholder="예) 총무팀">
    </div>
    <div class="row">
      <button class="btn" id="previewBtn">▶ 미리 보기</button>
      <button class="btn primary" id="genBtn">🔗 링크 만들고 복사</button>
    </div>
    <div class="out" id="linkOut"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  // ---------- 파라미터 ----------
  const params = new URLSearchParams(location.search);
  let TEXT = (params.get('text') || params.get('t') || params.get('msg') || '').trim();
  let FROM = (params.get('from') || '').trim();

  const $ = (s) => document.querySelector(s);
  const stage = $('#stage'), bg = $('#bg'), rays = $('#rays'), subtitle = $('#subtitle');
  const drum = $('#drum'), dugu = $('#drum .dugu'), reveal = $('#reveal'), flash = $('#flash');
  const actions = $('#actions'), skipBtn = $('#skip');

  const SCRIPTS = [
    ['이것은 단순한 메시지가 아니다', '인류의 운명을 바꿀', '단 하나의 진실', '준비되셨습니까'],
    ['전 세계가 숨을 죽였다', '수많은 이들이 이 순간을 기다렸다', '더 이상 숨길 수 없다', '지금 공개합니다'],
    ['아무도 예상하지 못했다', '그 누구도 감히 말하지 못했다', '하지만 오늘', '모든 것이 밝혀진다'],
  ];
  const SUBS = ['IN A WORLD', 'ONE MESSAGE', 'NO TURNING BACK', 'THE TRUTH'];

  // ---------- 토스트 ----------
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1800);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta);
      ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove(); return ok;
    }
  }
  function buildLink(text, from) {
    const u = new URL(location.href.split('?')[0].split('#')[0]);
    u.searchParams.set('text', text);
    if (from) u.searchParams.set('from', from);
    return u.toString();
  }

  // ---------- 오디오 ----------
  let ctx, master, reverb, introBus, noiseBuf;

  function makeImpulse(sec, decay) {
    const len = ctx.sampleRate * sec, buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }
  function initAudio() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 6;
    master = ctx.createGain(); master.gain.value = 0.85;
    master.connect(comp); comp.connect(ctx.destination);
    reverb = ctx.createConvolver(); reverb.buffer = makeImpulse(3.8, 2.4);
    const rv = ctx.createGain(); rv.gain.value = 0.5; reverb.connect(rv); rv.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  }
  function newIntroBus() {
    if (!ctx) return;
    if (introBus) { try { introBus.disconnect(); } catch (_) {} }
    introBus = ctx.createGain(); introBus.connect(master);
    const s = ctx.createGain(); s.gain.value = 0.35; introBus.connect(s); s.connect(reverb);
  }
  function killIntroBus() {
    if (!ctx || !introBus) return;
    const t = ctx.currentTime;
    introBus.gain.cancelScheduledValues(t);
    introBus.gain.setValueAtTime(introBus.gain.value, t);
    introBus.gain.linearRampToValueAtTime(0, t + 0.08);
    const old = introBus; setTimeout(() => { try { old.disconnect(); } catch (_) {} }, 200);
    introBus = null;
  }
  function send(node, dest, wet = 0.3) {
    node.connect(dest);
    if (dest === master && wet > 0) { const s = ctx.createGain(); s.gain.value = wet; node.connect(s); s.connect(reverb); }
  }
  function noise() { const n = ctx.createBufferSource(); n.buffer = noiseBuf; n.loop = true; return n; }

  // 팀파니/대북
  function boom(t, vol = 1, dest = introBus, pitch = 1) {
    if (!ctx || !dest) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(140 * pitch, t);
    o.frequency.exponentialRampToValueAtTime(36 * pitch, t + 0.6);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    o.connect(g); send(g, dest, 0.4);
    o.start(t); o.stop(t + 2.3);
    const n = noise(), f = ctx.createBiquadFilter(), ng = ctx.createGain();
    f.type = 'lowpass'; f.frequency.value = 500;
    ng.gain.setValueAtTime(vol * 0.7, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    n.connect(f); f.connect(ng); send(ng, dest, 0.3);
    n.start(t); n.stop(t + 0.3);
  }
  // 스네어
  function snare(t, vol = 0.4, dest = introBus) {
    if (!ctx || !dest) return;
    const n = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'highpass'; f.frequency.value = 1400;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    n.connect(f); f.connect(g); send(g, dest, 0.2);
    n.start(t, Math.random()); n.stop(t + 0.16);
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
    og.gain.setValueAtTime(vol * 0.6, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(og); send(og, dest, 0.1); o.start(t); o.stop(t + 0.1);
  }
  // 심벌
  function crash(t, vol = 0.5, dest = master, len = 3.5) {
    if (!ctx) return;
    const n = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'highpass'; f.frequency.value = 4500;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    n.connect(f); f.connect(g); send(g, dest, 0.5);
    n.start(t); n.stop(t + len + 0.1);
  }
  // 웅장한 저음 드론
  function drone(t, dur, dest = introBus) {
    if (!ctx || !dest) return;
    const g = ctx.createGain(), f = ctx.createBiquadFilter();
    f.type = 'lowpass'; f.Q.value = 2;
    f.frequency.setValueAtTime(180, t); f.frequency.linearRampToValueAtTime(1100, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.22, t + 2.5);
    g.gain.linearRampToValueAtTime(0.32, t + dur - 0.3);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    f.connect(g); send(g, dest, 0.5);
    // A 단조: A1, E2, A2, C3
    [55, 55.3, 82.4, 110, 130.8].forEach((fr, i) => {
      const o = ctx.createOscillator(); o.type = i === 4 ? 'triangle' : 'sawtooth';
      o.frequency.value = fr; o.detune.value = (Math.random() - .5) * 14;
      o.connect(f); o.start(t); o.stop(t + dur + 0.1);
    });
  }
  // 상승 효과음
  function riser(t, dur, dest = introBus) {
    if (!ctx || !dest) return;
    const n = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'bandpass'; f.Q.value = 3;
    f.frequency.setValueAtTime(200, t); f.frequency.exponentialRampToValueAtTime(6000, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + dur);
    g.gain.setValueAtTime(0.0001, t + dur + 0.02);
    n.connect(f); f.connect(g); send(g, dest, 0.3); n.start(t); n.stop(t + dur + 0.05);
  }
  // 금관
  function brass(t, freq, dur, vol = 0.18, dest = master) {
    if (!ctx) return;
    const f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'lowpass'; f.Q.value = 1.5;
    f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(3200, t + 0.06);
    f.frequency.exponentialRampToValueAtTime(1600, t + 0.4);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.04);
    g.gain.setValueAtTime(vol, t + dur - 0.15);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.6);
    f.connect(g); send(g, dest, 0.45);
    [-7, 7, 0].forEach((d) => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = freq; o.detune.value = d;
      const vib = ctx.createOscillator(), vg = ctx.createGain();
      vib.frequency.value = 5.5; vg.gain.setValueAtTime(0, t); vg.gain.linearRampToValueAtTime(freq * 0.006, t + 0.5);
      vib.connect(vg); vg.connect(o.frequency);
      o.connect(f); o.start(t); o.stop(t + dur + 0.7); vib.start(t); vib.stop(t + dur + 0.7);
    });
  }
  // 폭죽 펑
  function pop(vol = 0.25) {
    if (!ctx || ctx.state !== 'running') return;
    const t = ctx.currentTime;
    const n = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = 600 + Math.random() * 1600; f.Q.value = 0.8;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    n.connect(f); f.connect(g); send(g, master, 0.6); n.start(t, Math.random()); n.stop(t + 0.55);
    // 지글지글
    for (let i = 0; i < 6; i++) {
      const tt = t + 0.25 + Math.random() * 0.6;
      const c = noise(), cf = ctx.createBiquadFilter(), cg = ctx.createGain();
      cf.type = 'highpass'; cf.frequency.value = 5000;
      cg.gain.setValueAtTime(vol * 0.25, tt); cg.gain.exponentialRampToValueAtTime(0.0001, tt + 0.04);
      c.connect(cf); cf.connect(cg); cg.connect(master); c.start(tt, Math.random()); c.stop(tt + 0.05);
    }
  }

  // ---------- 파티클 ----------
  const cv = $('#fx'), g2 = cv.getContext('2d');
  const cv2 = $('#cf'), g3 = cv2.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = cv2.width = W * DPR; cv.height = cv2.height = H * DPR;
    g2.setTransform(DPR, 0, 0, DPR, 0, 0); g3.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  const embers = [], rockets = [], sparks = [], confetti = [];
  let emberOn = false, shake = 0, shakeTarget = 0;
  const rand = (a, b) => a + Math.random() * (b - a);
  const HUES = [45, 0, 200, 300, 120, 30, 50];

  function spawnEmber() {
    embers.push({ x: rand(0, W), y: H + 10, vx: rand(-.3, .3), vy: rand(-1.4, -.4), r: rand(.6, 2.2), life: 1, decay: rand(.002, .006) });
  }
  function launch(x) {
    rockets.push({ x: x ?? rand(W * .15, W * .85), y: H, vx: rand(-1.2, 1.2), vy: -rand(H * .012 + 7, H * .016 + 9), hue: HUES[(Math.random() * HUES.length) | 0] });
  }
  function explode(x, y, hue) {
    const n = 90 + (Math.random() * 60 | 0), speed = rand(3.5, 6.5), ring = Math.random() < .3;
    for (let i = 0; i < n; i++) {
      const a = Math.PI * 2 * i / n + rand(-.05, .05), s = ring ? speed : speed * Math.sqrt(Math.random());
      sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: rand(.008, .016), hue: hue + rand(-15, 15), r: rand(1.2, 2.4) });
    }
    pop(0.18 + Math.random() * 0.12);
  }
  function burstConfetti(n = 220) {
    for (let i = 0; i < n; i++) {
      const fromLeft = i % 2 === 0;
      confetti.push({
        x: fromLeft ? -10 : W + 10, y: H * rand(.55, .95),
        vx: (fromLeft ? 1 : -1) * rand(4, 13), vy: -rand(8, 18),
        w: rand(6, 12), h: rand(10, 18), rot: rand(0, 6.28), vr: rand(-.3, .3),
        hue: HUES[(Math.random() * HUES.length) | 0], life: 1,
      });
    }
  }

  function tick() {
    // 잔상 페이드 (투명 유지)
    g2.globalCompositeOperation = 'destination-out';
    g2.fillStyle = 'rgba(0,0,0,0.22)';
    g2.fillRect(0, 0, W, H);
    g2.globalCompositeOperation = 'lighter';

    if (emberOn && Math.random() < .5) spawnEmber();
    for (let i = embers.length - 1; i >= 0; i--) {
      const p = embers[i]; p.x += p.vx + Math.sin(p.y * .01) * .3; p.y += p.vy; p.life -= p.decay;
      if (p.life <= 0 || p.y < -10) { embers.splice(i, 1); continue; }
      g2.fillStyle = `hsla(38, 100%, 65%, ${p.life * .8})`;
      g2.beginPath(); g2.arc(p.x, p.y, p.r, 0, 6.283); g2.fill();
    }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i]; r.x += r.vx; r.y += r.vy; r.vy += 0.18;
      g2.fillStyle = `hsla(${r.hue}, 100%, 75%, 1)`;
      g2.beginPath(); g2.arc(r.x, r.y, 2.4, 0, 6.283); g2.fill();
      if (r.vy >= -1) { explode(r.x, r.y, r.hue); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.x += p.vx; p.y += p.vy; p.vx *= .975; p.vy = p.vy * .975 + .06; p.life -= p.decay;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      const flick = Math.random() < .1 ? 1.6 : 1;
      g2.fillStyle = `hsla(${p.hue}, 100%, ${55 + p.life * 30}%, ${p.life})`;
      g2.beginPath(); g2.arc(p.x, p.y, p.r * flick, 0, 6.283); g2.fill();
    }
    g2.globalCompositeOperation = 'source-over';
    if (!embers.length && !rockets.length && !sparks.length) g2.clearRect(0, 0, W, H);
    g3.clearRect(0, 0, W, H);
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i]; c.x += c.vx; c.y += c.vy; c.vx *= .985; c.vy = c.vy * .985 + .22; c.rot += c.vr;
      if (c.y > H + 30) { confetti.splice(i, 1); continue; }
      g3.save(); g3.translate(c.x, c.y); g3.rotate(c.rot); g3.scale(1, Math.cos(c.rot * 2));
      g3.fillStyle = `hsl(${c.hue}, 90%, 60%)`; g3.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); g3.restore();
    }

    // 화면 흔들림
    shake += (shakeTarget - shake) * .15;
    if (shake > .2) stage.style.transform = `translate(${rand(-shake, shake)}px, ${rand(-shake, shake)}px)`;
    else stage.style.transform = '';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  function impact(px) { shakeTarget = px; setTimeout(() => { shakeTarget = 0; }, 160); }

  // ---------- 타임라인 ----------
  let timers = [], fireworkLoop = null, running = false;
  const later = (ms, fn) => timers.push(setTimeout(fn, ms));
  function clearTimers() { timers.forEach(clearTimeout); timers = []; clearInterval(fireworkLoop); }

  function showLine(text, sub) {
    subtitle.innerHTML = '';
    const d = document.createElement('div'); d.className = 'line';
    d.textContent = text;
    if (sub) { const s = document.createElement('small'); s.textContent = sub; d.appendChild(s); }
    subtitle.appendChild(d);
  }

  function resetScene() {
    clearTimers();
    subtitle.innerHTML = '';
    drum.classList.remove('on'); reveal.classList.remove('on');
    rays.classList.remove('on', 'hot'); bg.classList.remove('on');
    actions.classList.remove('on'); skipBtn.classList.remove('on');
    flash.classList.remove('go');
    document.body.classList.remove('cinema');
    emberOn = false; shakeTarget = 0;
    rockets.length = sparks.length = confetti.length = 0;
  }

  function play() {
    initAudio();
    if (ctx && ctx.state === 'suspended') ctx.resume();
    resetScene();
    newIntroBus();
    running = true;

    const script = SCRIPTS[(Math.random() * SCRIPTS.length) | 0];
    const T0 = ctx ? ctx.currentTime + 0.1 : 0;
    const LINE = 2.4;          // 자막 간격(초)
    const ROLL_START = 0.6 + LINE * 4;   // ≈ 10.2s
    const ROLL_LEN = 4.2;
    const REVEAL = ROLL_START + ROLL_LEN + 0.7;

    document.body.classList.add('cinema');
    skipBtn.classList.add('on');
    later(300, () => { bg.classList.add('on'); emberOn = true; });

    if (ctx) {
      drone(T0, ROLL_START + ROLL_LEN);
      // 자막마다 둥-
      for (let i = 0; i < 4; i++) {
        const t = T0 + 0.6 + LINE * i;
        boom(t, 0.9);
        if (i >= 2) boom(t + 0.35, 0.6);
        if (i === 3) { boom(t + 0.7, 0.7); boom(t + 1.05, 0.8); }
      }
    }
    script.forEach((line, i) => {
      later((0.6 + LINE * i) * 1000, () => { showLine(line, SUBS[i]); impact(i >= 2 ? 10 : 6); });
      if (i >= 2) later((0.6 + LINE * i + 0.35) * 1000, () => impact(6));
    });

    // 두구두구
    later(ROLL_START * 1000, () => {
      subtitle.innerHTML = '';
      drum.classList.add('on'); rays.classList.add('on');
    });
    if (ctx) riser(T0 + ROLL_START, ROLL_LEN);
    let t = 0, hit = 0;
    while (t < ROLL_LEN) {
      const p = t / ROLL_LEN;                       // 0 → 1
      const interval = 0.17 - 0.135 * Math.pow(p, 0.7);
      const vol = 0.15 + 0.5 * p;
      if (ctx) {
        snare(T0 + ROLL_START + t, vol);
        if (hit % 2 === 0) boom(T0 + ROLL_START + t, 0.25 + 0.5 * p, introBus, 1.4);
      }
      const ms = (ROLL_START + t) * 1000, pp = p, h = hit;
      later(ms, () => {
        dugu.style.setProperty('--dsize', (9 + pp * 9).toFixed(2));
        dugu.style.setProperty('--pulse', h % 2 ? 1.08 : 0.96);
        shakeTarget = 1 + pp * 14;
      });
      t += interval; hit++;
    }

    // 정적
    later((ROLL_START + ROLL_LEN) * 1000, () => {
      drum.classList.remove('on'); rays.classList.remove('on');
      shakeTarget = 0; emberOn = false; bg.classList.remove('on');
    });

    // 짜잔!
    later(REVEAL * 1000 - 60, () => doReveal(false));
    if (ctx) scheduleFanfare(T0 + REVEAL - 0.18, introBus);
  }

  function scheduleFanfare(t, bus) {
    // 따- 단!
    brass(t, 392, 0.12, 0.16, bus || master);            // G4
    const T = t + 0.18;
    crash(T, 0.6); crash(T + 0.02, 0.4, master, 5);
    boom(T, 1.2, master, 0.8); boom(T + 0.05, 1, master, 1.2);
    [261.6, 329.6, 392, 523.3, 130.8].forEach((f) => brass(T, f, 2.2, 0.13));
    // 승리의 아르페지오
    [[1.5, 392], [1.7, 523.3], [1.9, 659.3]].forEach(([d, f]) => brass(T + d, f, 0.18, 0.12));
    [523.3, 659.3, 784, 1046.5, 261.6].forEach((f) => brass(T + 2.1, f, 2.6, 0.11));
    crash(T + 2.1, 0.35, master, 4);
    boom(T + 2.1, 0.9, master, 0.9);
  }

  function doReveal(skipped) {
    clearTimers();
    running = false;
    if (skipped) {
      killIntroBus();
      if (ctx) scheduleFanfare(ctx.currentTime + 0.05);
    }
    subtitle.innerHTML = ''; drum.classList.remove('on');
    document.body.classList.add('cinema');
    skipBtn.classList.remove('on');
    shakeTarget = 0;

    const delay = skipped ? 230 : 180;
    later(delay, () => {
      flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
      bg.classList.add('on'); rays.classList.add('on', 'hot');
      impact(28);

      const msg = reveal.querySelector('.msg');
      msg.textContent = TEXT;
      const len = [...TEXT].length || 1;
      const size = Math.max(5, Math.min(20, 64 / Math.sqrt(len)));
      msg.style.fontSize = size + 'vmin';
      // 애니메이션 재시작
      msg.style.animation = 'none'; void msg.offsetWidth; msg.style.animation = '';
      reveal.querySelector('.from').textContent = FROM ? `— ${FROM} —` : '';
      reveal.querySelectorAll('.kicker, .from').forEach((el) => { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; });
      reveal.classList.add('on');

      burstConfetti(260);
      for (let i = 0; i < 4; i++) setTimeout(() => launch(W * (0.15 + i * 0.23)), i * 90);
      let n = 0;
      fireworkLoop = setInterval(() => {
        n++;
        launch(); if (n < 14 && Math.random() < .6) launch();
        if (n === 6) burstConfetti(160);
        if (n > 40) clearInterval(fireworkLoop);
      }, 420);
      timers.push(setTimeout(() => actions.classList.add('on'), 2600));
    });
  }

  // ---------- 이벤트 ----------
  skipBtn.addEventListener('click', () => { if (running) doReveal(true); });
  $('#replayBtn').addEventListener('click', play);
  $('#shareBtn').addEventListener('click', async () => {
    const ok = await copy(buildLink(TEXT, FROM));
    toast(ok ? '링크를 복사했습니다' : '복사에 실패했습니다');
  });
  $('#makeBtn').addEventListener('click', () => {
    resetScene();
    $('#msgInput').value = ''; $('#fromInput').value = '';
    $('#linkOut').classList.remove('on');
    const m = $('#maker'); m.hidden = false; m.classList.remove('hide');
    history.replaceState(null, '', location.pathname);
  });

  $('#startBtn').addEventListener('click', () => {
    $('#intro').classList.add('hide');
    setTimeout(() => { $('#intro').hidden = true; }, 800);
    play();
  });

  function readMaker() {
    const text = $('#msgInput').value.trim(), from = $('#fromInput').value.trim();
    if (!text) { toast('공개할 내용을 적어주세요'); $('#msgInput').focus(); return null; }
    return { text, from };
  }
  $('#genBtn').addEventListener('click', async () => {
    const v = readMaker(); if (!v) return;
    const link = buildLink(v.text, v.from);
    const out = $('#linkOut'); out.textContent = link; out.classList.add('on');
    const ok = await copy(link);
    toast(ok ? '링크를 복사했습니다! 친구에게 보내세요' : '아래 링크를 직접 복사해 주세요');
  });
  $('#previewBtn').addEventListener('click', () => {
    const v = readMaker(); if (!v) return;
    TEXT = v.text; FROM = v.from;
    history.replaceState(null, '', buildLink(TEXT, FROM));
    const m = $('#maker'); m.classList.add('hide'); setTimeout(() => { m.hidden = true; }, 800);
    play();
  });

  // ---------- 시작 ----------
  if (TEXT) $('#intro').hidden = false;
  else $('#maker').hidden = false;
})();
</script>
</body>
</html>
